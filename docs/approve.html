<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Approve access · CPWD Rate Finder</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f9; --surface: #fff; --border: #e2e6ec; --text: #1c2430; --muted: #64707d;
  --accent: #0f6e4f; --accent-soft: #e6f4ee; --danger: #b3261e; --danger-soft: #fdecea;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --bg: #0f1513; --surface: #17201d; --border: #2a3632; --text: #e6ece9; --muted: #95a39d;
    --accent: #3fb08a; --accent-soft: #173a2f; --danger: #ff8a80; --danger-soft: #3a1d1b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
main { max-width: 460px; margin: 0 auto; padding: 28px 16px; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #0f6e4f, #0b5a40); color: #fff; display: grid; place-items: center; font-weight: 700; }
.brand b { font-size: 17px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 20px; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: 14px; }
dt { color: var(--muted); } dd { margin: 0; font-weight: 600; word-break: break-word; }
button { font: inherit; font-weight: 700; font-size: 16px; padding: 14px; border-radius: 10px; border: 0; cursor: pointer; color: #fff; width: 100%; }
button.approve { background: var(--accent); } button.reject { background: var(--danger); }
button:disabled { opacity: .6; cursor: default; }
.result { border-radius: 10px; padding: 12px; font-weight: 600; }
.result.ok { background: var(--accent-soft); color: var(--text); }
.result.bad { background: var(--danger-soft); color: var(--danger); }
.foot { text-align: center; font-size: 12px; color: var(--muted); }
.foot span { color: #d32f2f; font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="brand"><div class="mark">₹</div><b>CPWD Rate Finder</b></div>
  <div class="card" id="card"><p>Loading request…</p></div>
  <div class="foot">Built for Saranik · Powered by Arya · <span>TCD1</span></div>
</main>
<script src="config.js"></script>
<script>
(function () {
  var CFG = window.APP_CONFIG || {};
  var API = String(CFG.SUPABASE_URL || '').replace(/\/+$/, '') + '/functions/v1/email-action';
  var q = new URLSearchParams(location.search);
  var t = q.get('t') || '';
  var card = document.getElementById('card');
  // Remove the one-time code from the address bar / history.
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(iso) { try { return new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' }) + ' IST'; } catch (e) { return iso; } }
  function post(op) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY }, body: JSON.stringify({ t: t, op: op }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); },
            function () { return { ok: false, d: { error: 'Could not reach the server. Check your internet connection and reload.' } }; });
  }
  function details(dev) {
    return '<dl><dt>Name</dt><dd>' + esc(dev.name) + '</dd><dt>Phone</dt><dd>' + esc(dev.phone) + '</dd>' +
      (dev.email ? '<dt>Email</dt><dd>' + esc(dev.email) + '</dd>' : '') +
      '<dt>Device</dt><dd>' + esc(dev.model || '—') + '</dd><dt>Requested</dt><dd>' + esc(when(dev.created_at)) + '</dd>' +
      '<dt>Status now</dt><dd>' + esc(dev.status) + '</dd></dl>';
  }
  function problem(msg) { card.innerHTML = '<h1>Link not usable</h1><div class="result bad">' + esc(msg) + '</div><p>You can still approve, reject or revoke phones from the Admin screen in the app (press and hold the green ₹ logo).</p>'; }

  if (!t) { problem('This link is incomplete.'); return; }
  post('peek').then(function (r) {
    if (!r.ok) { problem(r.d.error || 'This link is not valid.'); return; }
    var approve = r.d.action === 'approve';
    card.innerHTML = '<h1>' + (approve ? 'Approve this phone?' : 'Reject this request?') + '</h1>' + details(r.d.device) +
      '<button type="button" class="' + (approve ? 'approve' : 'reject') + '" id="go">' + (approve ? 'Yes, approve' : 'Yes, reject') + '</button>' +
      '<p>This link works once. ' + (approve ? 'The phone will open the app automatically the next time it checks.' : 'The phone will stay blocked.') + '</p>';
    document.getElementById('go').addEventListener('click', function () {
      var b = this; b.disabled = true; b.textContent = 'Working…';
      post('confirm').then(function (c) {
        if (!c.ok) { problem(c.d.error || 'That did not work.'); return; }
        var msg = c.d.result === 'already_decided'
          ? 'This request was already handled earlier (status: ' + esc(c.d.device.status) + '). Nothing was changed.'
          : (approve ? 'Approved. ' + esc(c.d.device.name) + ' can now use the app.' : 'Rejected. ' + esc(c.d.device.name) + '\'s phone stays blocked.');
        card.innerHTML = '<h1>Done</h1><div class="result ' + (c.d.result === 'already_decided' ? 'bad' : 'ok') + '">' + msg + '</div>' + details(c.d.device) + '<p>You can close this page.</p>';
      });
    });
  });
})();
</script>
</body>
</html>
