name: Fetch source PDFs
on:
  push:
    branches: [sources]
    paths: ['urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: sources }
      - name: Download
        run: |
          while read -r out url; do
            [ -z "$out" ] && continue
            [ -f "$out" ] && continue
            mkdir -p "$(dirname "$out")"
            curl -sSL --retry 3 -m 300 -A "Mozilla/5.0" -o "$out" "$url" && echo "OK $out $(stat -c%s "$out")" || { echo "FAIL $out"; rm -f "$out"; }
          done < urls.txt | tee fetch-log.txt
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -m "Fetched source files" || true; git push
